<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e4ecff">
<meta name="robots" content="noindex">
<title>Offline | ARCHIVUM</title>
<style>
  :root{color-scheme:light;--ink:#1b2166;--muted:#474d8a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 22% 20%,rgba(141,155,255,.5),transparent 36%),linear-gradient(140deg,#eef2ff,#dce4ff 55%,#f8f9ff);color:var(--ink);font:16px/1.5 Lato,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-align:center}
  main{max-width:340px;animation:in .5s cubic-bezier(.16,1,.3,1) both}
  .icon{width:76px;height:76px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;background:rgba(27,33,102,.09);color:var(--ink)}
  .icon svg{width:36px;height:36px;animation:pulse 2.4s ease-in-out infinite}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:-.01em}
  p{margin:0 0 26px;color:var(--muted)}
  button{font:inherit;font-weight:800;padding:13px 28px;border:0;border-radius:999px;background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 10px 24px rgba(27,33,102,.28);transition:transform .2s ease}
  button:active{transform:scale(.95)}
  small{display:block;margin-top:18px;color:var(--muted);font-size:13px;opacity:.85}
  @keyframes in{from{opacity:0;transform:translateY(14px)}}
  @keyframes pulse{50%{opacity:.45}}
  @media(prefers-reduced-motion:reduce){main,.icon svg{animation:none}}
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M19 12.9a10 10 0 0 0-2.7-1.9"/><path d="M2 8.8a15 15 0 0 1 4.2-2.7"/><path d="M22 8.8A15 15 0 0 0 10.7 5"/><circle cx="12" cy="20" r=".6" fill="currentColor"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>ARCHIVUM needs an internet connection to load notes and papers. Check your Wi-Fi or mobile data and try again.</p>
  <button type="button" id="retry">Try again</button>
  <small id="status">Waiting for connection…</small>
</main>
<script>
  var go = function () { location.reload(); };
  document.getElementById('retry').addEventListener('click', function () {
    var s = document.getElementById('status');
    s.textContent = navigator.onLine ? 'Reconnecting…' : 'Still offline.';
    if (navigator.onLine) go();
  });
  window.addEventListener('online', go);
</script>
</body>
</html>
